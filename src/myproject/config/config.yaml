###
# HippoRAG Configuration
###

llm:
  temperature: 0.0
  max_tokens: 1024
  retries: 1
  request_delay_seconds: 0.5
  timeout: 18
  max_prompt_chars: 1000  # truncate documents before sending to LLM


#
# Retrieval
#
retrieval:
  # "hipporag" — full pipeline: triple matching + PPR graph walk (default)
  # "dense"    — baseline: embed query, return top-k passages by cosine similarity
  mode: "dense"
  top_k: 5
  ppr_alpha: 0.85
  max_iter: 30

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

logging:
  verbose: true

kg:
  save_path: myproject/kg/graph.pkl
  similarity_threshold: 0.75
  max_passages: 10000
  # The maximum amount of docs. This is not implimented.
  max_docs: 10000
  # Directory where saved KG models are stored.
  # Inside Docker this MUST match the volume mount in docker-compose.yml (/app/models).
  # Outside Docker (local dev) this resolves relative to the project root.
  models_dir: ./data

  # Name of the KG to load automatically on startup.
  # Set to the slug you used when saving, e.g. "eval_corpus".
  # Set to null (or leave blank) to start without a pre-loaded KG.
  active_model: null

  # Whether to auto-save the KG after a successful build.
  # The model is saved under models_dir/<auto_save_name>/
  auto_save: true
  auto_save_name: "latest"