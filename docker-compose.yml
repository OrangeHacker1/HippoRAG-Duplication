services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./kg:/app/kg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      build-kg:
        condition: service_completed_successfully

  build-kg:
    build: .
    command: python run_build_kg.py
    env_file: .env
    volumes:
      - ./kg:/app/kg

  eval:
    build: .
    command: python run_eval.py
    env_file: .env
    volumes:
      - ./kg:/app/kg
    depends_on:
      build-kg:
        condition: service_completed_successfully
