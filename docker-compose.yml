services:
  app:
    build: .
    image: myproject:local
    container_name: myproject_app
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # --- KG PERSISTENCE ---
      # This named volume survives `docker compose down` and `docker compose up`.
      # All saved KG pickles live here. To permanently delete a saved model,
      # run: docker volume rm <project>_kg_data
      # Or delete the specific subfolder: docker exec myproject_app rm -rf /app/models/<name>
      - ./data:/app/models
      - ./data:/app/data
    depends_on:
      vectordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Example second service: vector database. Replace or remove for your project.
  vectordb:
    image: qdrant/qdrant:v1.9.0
    container_name: myproject_vectordb
    volumes:
      - vectordb_data:/qdrant/storage
    #healthcheck:
    #  test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
    #  interval: 10s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  # Persists the Qdrant vector index across container restarts
  vectordb_data:
  # Persists saved HippoRAG knowledge graphs across container restarts.
  # Delete with: docker volume rm <project_name>_kg_data
  #kg_data:

