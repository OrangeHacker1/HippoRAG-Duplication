[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["Official-HippoRAG-Repo", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    Official-HippoRAG-Repo
  | \.venv
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["Official-HippoRAG-Repo", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "user_story: user story acceptance tests",
]
