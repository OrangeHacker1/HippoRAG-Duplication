[project]
name = "HippoRAG-Duplicate"
version = "0.1.0"
description = "This is replication project. The goal is to replicate the HippoRAG 2 paper. We seek to reproduce their results."
requires-python = ">=3.11"

# Pin all production dependencies here. No floating versions.
# This is just a starting point; add more as your project needs them.
dependencies = [
    # Core
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",

    # Networking / API
    "requests==2.32.3",

    # Graph processing
    "networkx==3.3",

    # Embeddings
    "sentence-transformers==3.0.1",
    "scikit-learn==1.5.1",
    "numpy==1.26.4",
    "scipy==1.13.1",

    # Torch (required by sentence-transformers)
    "torch>=2.2.0",
    "transformers==4.44.2",

    # Optional but recommended (performance + progress tracking)
    "tqdm==4.66.4",

    # Web API
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "anthropic==0.40.0",
    "loguru==0.7.2",

    # Testing
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "pydantic==2.6.4",

    # Code quality
    "ruff==0.6.3",
    "black==24.8.0",
    "mypy==1.11.2",
    "pip-audit==2.7.3",
]

[project.optional-dependencies]
# Tools the TA runs during grading. These are NOT optional in practice.
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "black==24.4.2",
    "mypy==1.10.0",
    "locust==2.27.0",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "user_story: associate a test with a user story ID, e.g. @pytest.mark.user_story('US-01')",
]
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/myproject"]
branch = true
# Exclude generated and migration code from coverage; if you don't have any,
# remove these patterns.
omit = [
    "src/myproject/__main__.py",
]

[tool.coverage.report]
# The grading script enforces 70% via --cov-fail-under in the Makefile.
# Setting it here too is belt-and-suspenders.
fail_under = 70
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # we use black for line length

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy (types)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
