      - retrieval/retriever.py
      - retrieval/triple_matcher.py
      - retrieval/filter.py
      - retrieval/ppr.py
      - llm/llm_client.py
      - api/app.py
    tests:
      - tests/user_stories/test_stories.py::test_us01_submit_query_returns_answer
      - tests/integration/test_api.py::TestQueryEndpoint::test_valid_query_returns_answer

  - story_id: US-02
    spec_section: "Data Flow / Retrieval and Answer Generation"
    source_modules:
      - retrieval/retriever.py
      - kg/graph_store.py
      - api/app.py
    tests:
      - tests/user_stories/test_stories.py::test_us02_retrieved_passages_visible

  - story_id: US-03
    spec_section: "Public Interfaces / API Server"
    source_modules:
      - api/app.py
    tests:
      - tests/user_stories/test_stories.py::test_us03_health_check
      - tests/integration/test_api.py::TestHealthEndpoint::test_health_returns_ok

  - story_id: US-04
    spec_section: "Public Interfaces / API Server / POST /api/evaluate"
    source_modules:
      - api/app.py
